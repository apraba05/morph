apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-rules
data:
  rules.yaml: |
    longContextThreshold: {{ .Values.routing.longContextThreshold }}
    backends:
      edit: {{ .Values.routing.editBackend }}
      longContext: {{ .Values.routing.longContextBackend }}
      default: {{ .Values.routing.defaultBackend }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
          volumeMounts:
            - name: rules
              mountPath: /etc/morph-router
      volumes:
        - name: rules
          configMap:
            name: {{ .Release.Name }}-rules
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
